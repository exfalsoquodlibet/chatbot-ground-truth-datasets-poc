name: Validate CSV to JSONL Conversion

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  validate_conversion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Determine base commit for diff
        run: |
          # Fetch main to ensure we have the latest
          git fetch origin main
          # Get the actual SHA of origin/main
          echo "GIT_BEFORE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          echo "GIT_AFTER=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Validate CSV to JSONL conversion (dry-run)
        run: |
          uv run python tools/convert_csv_to_jsonl.py --dry-run
        env:
          GIT_BEFORE: ${{ env.GIT_BEFORE }}
          GIT_AFTER: ${{ env.GIT_AFTER }}